<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Resort - GKPI Data Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    html, body { overscroll-behavior-y: none !important; scroll-behavior: smooth; background-color: #f8fafc; }
    body::before {
        content: ""; position: fixed; inset: 0;
        background-image: url('https://lh3.googleusercontent.com/d/1Pu8OgBaZUCEARI4yL2rM1tLnY7GfJUv3');
        background-size: cover; background-position: center; opacity: 0.1; z-index: -1; pointer-events: none;
    }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-zoom { animation: zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="antialiased text-slate-800">

<!-- HALAMAN LOGIN -->
<div id="loginPage" class="h-screen w-full flex items-center justify-center p-4 relative z-10">
  <div class="w-full max-w-md glass-card rounded-[2rem] p-8 shadow-2xl border border-slate-200 animate-zoom">
    <div class="text-center mb-8">
      <img src="https://lh3.googleusercontent.com/d/1g-FutTprQkPGFSZ94neWMBLWKJEkpGfF" class="w-20 h-20 mx-auto mb-4 drop-shadow-md">
      <h2 class="text-2xl font-black text-slate-800 tracking-tight">Portal Informasi</h2>
      <p class="text-indigo-600 font-bold text-xs mt-2 uppercase tracking-widest bg-indigo-50 inline-block px-3 py-1 rounded-full border border-indigo-100">Khusus Akses Resort / Jemaat</p>
    </div>
    <form onsubmit="handleLoginResort(event)" class="space-y-5">
      <div class="space-y-1.5"><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Username (Kode Unit)</label>
      <div class="relative"><i class="fas fa-church absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i><input type="text" id="user" required autocomplete="off" class="w-full py-3.5 pl-11 pr-4 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-sm text-slate-700"></div></div>
      <div class="space-y-1.5"><label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Password</label>
      <div class="relative"><i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i><input type="password" id="pass" required class="w-full py-3.5 pl-11 pr-4 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500 font-bold text-sm text-slate-700"></div></div>
      <button type="submit" id="btnLogin" class="w-full bg-slate-800 text-white py-4 rounded-xl font-black text-sm uppercase tracking-widest shadow-lg hover:-translate-y-0.5 active:scale-95 transition-all mt-4"><i class="fas fa-sign-in-alt mr-2"></i> Akses Portal</button>
    </form>
  </div>
</div>

<!-- PORTAL UTAMA (SINGLE PAGE) -->
<div id="mainApp" class="hidden min-h-screen flex flex-col relative z-10">
  
  <!-- NAVBAR ATAS -->
  <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <img src="https://lh3.googleusercontent.com/d/1g-FutTprQkPGFSZ94neWMBLWKJEkpGfF" class="w-10 h-10 drop-shadow-sm">
        <div>
            <h1 class="font-black text-lg text-slate-800 leading-none">GKPI Hub</h1>
            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Portal Informasi Resmi</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
          <button onclick="loadDataResort(true)" class="w-10 h-10 flex items-center justify-center bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-600 hover:text-white transition-all shadow-sm"><i class="fas fa-sync-alt"></i></button>
          <button onclick="handleLogout()" class="w-10 h-10 flex items-center justify-center bg-rose-50 text-rose-600 rounded-full hover:bg-rose-500 hover:text-white transition-all shadow-sm"><i class="fas fa-power-off"></i></button>
      </div>
    </div>
  </header>

  <!-- KONTEN -->
  <main class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 py-8 animate-zoom">
      
      <!-- KARTU IDENTITAS GEREJA -->
      <div class="bg-gradient-to-br from-indigo-700 to-blue-800 rounded-[2rem] p-8 md:p-10 shadow-xl mb-8 relative overflow-hidden text-white">
          <i class="fas fa-place-of-worship absolute -right-4 -bottom-4 text-9xl opacity-10"></i>
          <div class="relative z-10 flex flex-col md:flex-row justify-between md:items-end gap-6">
              <div>
                  <span id="lblWilayah" class="bg-white/20 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-widest backdrop-blur-sm border border-white/30 inline-block mb-4">Wilayah -</span>
                  <h2 id="lblNamaUnit" class="text-3xl md:text-5xl font-black tracking-tight mb-2">Memuat Data...</h2>
                  <p class="text-indigo-100 text-sm font-medium flex items-center gap-2"><i class="fas fa-file-signature text-indigo-300"></i> No. Register: <span id="lblNoReg" class="font-bold text-white">Belum ada</span></p>
              </div>
              <div class="bg-white/10 backdrop-blur-md border border-white/20 p-4 rounded-2xl flex gap-6 shrink-0">
                  <div class="text-center"><p class="text-[10px] uppercase font-bold text-indigo-200 tracking-widest mb-1">Total RT</p><p id="lblRT" class="text-2xl font-black">0</p></div>
                  <div class="w-px bg-white/20"></div>
                  <div class="text-center"><p class="text-[10px] uppercase font-bold text-indigo-200 tracking-widest mb-1">Total Jiwa</p><p id="lblJiwa" class="text-2xl font-black">0</p></div>
              </div>
          </div>
      </div>

      <!-- TABEL DAFTAR MAJELIS -->
      <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="p-6 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
              <h3 class="font-black text-slate-800 text-lg flex items-center gap-2"><i class="fas fa-id-badge text-indigo-500"></i> Susunan Personil Majelis</h3>
              <span id="lblTotalMajelis" class="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-lg text-xs font-bold shadow-sm">0 Personil</span>
          </div>
          <div class="overflow-x-auto">
              <table class="w-full text-left whitespace-nowrap">
                  <thead class="bg-white border-b border-slate-100">
                      <tr>
                          <th class="p-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest w-12 text-center">No</th>
                          <th class="p-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Nama Lengkap</th>
                          <th class="p-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Jabatan</th>
                          <th class="p-4 text-[10px] font-bold text-slate-400 uppercase tracking-widest">Penempatan</th>
                      </tr>
                  </thead>
                  <tbody id="tblMajelis" class="divide-y divide-slate-100 text-sm">
                      <tr><td colspan="4" class="p-8 text-center text-slate-400"><i class="fas fa-circle-notch fa-spin mr-2"></i> Mengambil data dari pusat...</td></tr>
                  </tbody>
              </table>
          </div>
      </div>

  </main>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwOnaTcwjyY1QYxs_gpKSCePhIAmyfyWWZG_J-0XILWUTLPm4hnlHw5tJjCczChM3LE/exec";
  const SECRET_API_KEY = "GKPI_HUB_SECURE_2026";
  
  let USER_RESORT = null;

  async function apiCall(action, payload = {}) {
      payload.api_key = SECRET_API_KEY; 
      const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: action, payload: payload }) });
      return JSON.parse(await response.text());
  }

  document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('gkpi_resort_session');
      if (saved) { USER_RESORT = JSON.parse(saved); showDashboard(); loadDataResort(false); }
  });

  function handleLoginResort(e) {
      e.preventDefault();
      const u = document.getElementById('user').value; const p = document.getElementById('pass').value;
      const btn = document.getElementById('btnLogin'); btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> MEMERIKSA...'; btn.disabled = true;
      
      apiCall('checkLogin', {username: u, password: p}).then(res => { 
          if (res.status === 'success') { 
              if(String(res.role).toLowerCase() !== 'resort') {
                  Swal.fire('Akses Ditolak', 'Gunakan portal utama untuk Admin.', 'error');
              } else if (!res.akses_unit || res.akses_unit === 'ALL' || res.akses_unit === 'undefined') {
                  Swal.fire('Error Database', 'Admin Pusat belum mengatur KODE AKSES UNIT untuk akun Anda di database.', 'error');
              } else {
                  USER_RESORT = res; localStorage.setItem('gkpi_resort_session', JSON.stringify(res)); 
                  showDashboard(); loadDataResort(true);
              }
          } else { Swal.fire('Gagal Login', 'Username atau Password salah!', 'error'); }
          btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Akses Portal'; btn.disabled = false;
      }).catch(err => { Swal.fire('Error', String(err), 'error'); btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> Akses Portal'; });
  }

  function handleLogout() {
      localStorage.removeItem('gkpi_resort_session'); localStorage.removeItem('gkpi_resort_data'); location.reload();
  }

  function showDashboard() {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      document.getElementById('lblNamaUnit').innerText = USER_RESORT.akses_unit;
  }

  async function loadDataResort(forceRefresh = false) {
      if (!forceRefresh) {
          const cached = await localforage.getItem('gkpi_resort_data');
          if (cached) { renderData(cached); return; }
      }
      Swal.fire({ title: 'Menarik Data dari Pusat...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      apiCall('getAppData', { role: USER_RESORT.role, akses_unit: USER_RESORT.akses_unit }).then(res => {
          localforage.setItem('gkpi_resort_data', res);
          renderData(res); Swal.close();
      }).catch(err => Swal.fire('Error', String(err), 'error'));
  }

  function renderData(data) {
      // 1. Ekstrak Info Gereja dari Array
      let infoGrj = { Wilayah: '-', No_Register: 'Belum terdaftar', Total_RT: 0, Total_Jiwa: 0 };
      
      if(data.gereja && data.gereja.length > 0) {
          // Cari spesifik yang namanya persis sama dengan Akses_Unit
          const targetUnit = String(USER_RESORT.akses_unit).toLowerCase();
          const grjSpecific = data.gereja.find(g => String(g.Nama_Gereja).toLowerCase() === targetUnit || String(g.Induk_Resort || g.Resort).toLowerCase() === targetUnit);
          
          if(grjSpecific) {
              infoGrj.Wilayah = grjSpecific.Wilayah || '-';
              infoGrj.No_Register = grjSpecific.No_Register || grjSpecific['No Register'] || 'Data Kosong';
              
              // Jika ini Resort, totalkan semua RT/Jiwa di bawahnya
              if(String(grjSpecific.Tipe_Gereja || grjSpecific.Status_Gereja).toLowerCase().includes('resort')) {
                 let totR = 0, totJ = 0;
                 data.gereja.forEach(g => { totR += parseInt(g.Total_RT)||0; totJ += parseInt(g.Total_Jiwa)||0; });
                 infoGrj.Total_RT = totR; infoGrj.Total_Jiwa = totJ;
              } else {
                 infoGrj.Total_RT = parseInt(grjSpecific.Total_RT) || 0;
                 infoGrj.Total_Jiwa = parseInt(grjSpecific.Total_Jiwa) || 0;
              }
          }
      }

      // Cetak Info ke Layar
      document.getElementById('lblWilayah').innerText = "Wilayah " + infoGrj.Wilayah;
      document.getElementById('lblNoReg').innerText = infoGrj.No_Register;
      document.getElementById('lblRT').innerText = infoGrj.Total_RT.toLocaleString('id-ID');
      document.getElementById('lblJiwa').innerText = infoGrj.Total_Jiwa.toLocaleString('id-ID');

      // 2. Render Tabel Majelis (Sortir Hierarki & Abjad)
      let listMajelis = data.majelis || [];
      document.getElementById('lblTotalMajelis').innerText = listMajelis.length + " Personil";
      
      const tbodyM = document.getElementById('tblMajelis');
      if(listMajelis.length === 0) {
          tbodyM.innerHTML = '<tr><td colspan="4" class="p-10 text-center text-slate-400 font-bold border-2 border-dashed border-slate-100 rounded-xl m-4">Belum ada data majelis yang terdaftar.</td></tr>';
      } else {
          // Sortir berdasarkan Nama
          listMajelis.sort((a,b) => String(a.Nama_Lengkap).localeCompare(String(b.Nama_Lengkap)));
          
          tbodyM.innerHTML = listMajelis.map((m, idx) => `
          <tr class="hover:bg-slate-50 transition-colors">
              <td class="p-4 text-center font-bold text-slate-400 text-xs">${idx + 1}</td>
              <td class="p-4 font-bold text-slate-800">${m.Nama_Lengkap||'-'}</td>
              <td class="p-4"><span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-md text-[10px] font-black uppercase tracking-widest border border-indigo-100">${m.Jabatan||'-'}</span></td>
              <td class="p-4 text-xs font-semibold text-slate-500"><i class="fas fa-church text-slate-300 mr-1.5"></i> ${m.Nama_Gereja||'Tingkat Resort'}</td>
          </tr>`).join('');
      }
  }
</script>
</body>
</html>
